[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-phoenix-backend"
version = "0.1.0"
description = "Rental property database API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53,<1",
    "sqlalchemy[asyncio]>=2.0.53,<2.1",
    "asyncpg>=0.31,<1",
    "alembic>=1.20,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "argon2-cffi>=25.1,<26",
    "pyjwt>=2.14,<3",
    "python-multipart>=0.0.32,<0.1",
    "pillow>=12.3,<13",
    "pillow-heif>=1.7,<2",
    "tzdata>=2026.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<1",
    "testcontainers[postgres]>=4.15,<5",
    "ruff>=0.16,<0.17",
    "black>=26.5,<27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
