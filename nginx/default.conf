server {
    listen 80;
    server_name _;

    # Many photos and videos can be sent in one upload request.
    client_max_body_size 1024m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Overwrite, never append: the API trusts this header for the login rate limit and audit IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Reachable only through X-Accel-Redirect issued by the API after an access check.
    location /internal-media/ {
        internal;
        alias /data/media/;
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
